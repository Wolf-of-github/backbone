# k3s server config file. Installed to /etc/rancher/k3s/config.yaml by scripts/install-k3s.sh.
# depends_on: []
#
# Kong is the gateway, so k3s's bundled Traefik and ServiceLB are disabled.
# Placeholders in <angle brackets> are substituted from .env by install-k3s.sh.

disable:
  - traefik
  - servicelb

# kubeconfig written 0600 (root-only); install-k3s.sh copies + re-permissions a user copy.
write-kubeconfig-mode: "0600"

# Names/IPs the API server cert is valid for. install-k3s.sh appends the real values.
tls-san:
  - "<K3S_SERVER_IP>"
  - "<DOMAIN>"

# Default CIDRs, pinned so they don't drift between installs.
cluster-cidr: "10.42.0.0/16"
service-cidr: "10.43.0.0/16"
cluster-dns: "10.43.0.10"

# Keep the local-path provisioner (Phase 0 needs a default StorageClass).
# (It is on by default; listed here for clarity — do NOT add it to `disable`.)
