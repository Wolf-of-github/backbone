# deployment.yaml
# Purpose: kube-state-metrics - exposes Kubernetes OBJECT state as Prometheus metrics.
# depends_on: [k8s/base/namespaces.yaml]
#
# WHY THIS EXISTS (added 2026-10-04)
# It was missing, and that made alerts silently dead rather than merely absent.
# alert-rules.yaml has queried `kube_pod_container_status_restarts_total` since
# Phase 5B, but nothing in the cluster ever produced a `kube_*` metric: the
# Prometheus scrape config covers Prometheus itself, Kong, nodes, cAdvisor and
# annotated pods, and kube-state-metrics was never deployed. So PodCrashLooping
# has never been able to fire. An alert rule that references a non-existent
# metric does not error - it just evaluates to nothing, forever, which looks
# exactly like "everything is fine".
#
# That is also what let a backup CronJob sit Pending for a week unnoticed
# (issues.txt P7-7). The PodPendingTooLong and BackupNotSucceeding rules added
# alongside this file depend on it.
#
# WHAT IT IS, precisely: it does NOT measure resource usage - that is
# metrics-server (live, for HPA and `kubectl top`) and cAdvisor (historical
# container metrics, already scraped). kube-state-metrics watches the API
# server and turns OBJECT state into metrics: how many replicas a Deployment
# wants vs has, what phase a pod is in, when a CronJob last succeeded. The
# three are complementary, which is why all three are wanted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
# Read-only across the object kinds whose state is turned into metrics.
# Deliberately NOT included: secrets. kube-state-metrics can expose metadata
# about secrets (names, types, counts) but never needs their contents, and the
# upstream default omits them for that reason - a metrics endpoint is an
# unauthenticated read inside the cluster.
- apiGroups: [""]
  resources:
  - nodes
  - pods
  - services
  - resourcequotas
  - replicationcontrollers
  - limitranges
  - persistentvolumeclaims
  - persistentvolumes
  - namespaces
  - endpoints
  verbs: ["list", "watch"]
- apiGroups: ["apps"]
  resources:
  - statefulsets
  - daemonsets
  - deployments
  - replicasets
  verbs: ["list", "watch"]
- apiGroups: ["batch"]
  resources:
  - cronjobs
  - jobs
  verbs: ["list", "watch"]
- apiGroups: ["autoscaling"]
  resources:
  - horizontalpodautoscalers
  verbs: ["list", "watch"]
- apiGroups: ["policy"]
  resources:
  - poddisruptionbudgets
  verbs: ["list", "watch"]
- apiGroups: ["storage.k8s.io"]
  resources:
  - storageclasses
  - volumeattachments
  verbs: ["list", "watch"]
- apiGroups: ["certificates.k8s.io"]
  resources:
  - certificatesigningrequests
  verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
- kind: ServiceAccount
  name: kube-state-metrics
  namespace: observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: observability
  labels:
    app: kube-state-metrics
spec:
  # Single replica deliberately. Two would double-report every metric, and
  # Prometheus would scrape both - every `kube_*` count would read twice its
  # real value, which is worse than brief unavailability during a restart.
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      annotations:
        # This is how it gets scraped - the kubernetes-pods job in
        # prometheus/configmap.yaml is annotation-driven, so no scrape-config
        # change is needed. Port 8080 is the metrics port; 8081 is its own
        # self-health telemetry, deliberately not scraped.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
      - name: kube-state-metrics
        image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
        ports:
        - containerPort: 8080
          name: http-metrics
        - containerPort: 8081
          name: telemetry
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 8081
          initialDelaySeconds: 5
          timeoutSeconds: 5
        resources:
          requests:
            # Memory scales with object count, not traffic. This cluster has
            # ~40 pods; the request is sized for growth well past that.
            cpu: "10m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "192Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: observability
  labels:
    app: kube-state-metrics
spec:
  type: ClusterIP
  selector:
    app: kube-state-metrics
  ports:
  - name: http-metrics
    port: 8080
    targetPort: 8080
  - name: telemetry
    port: 8081
    targetPort: 8081
