# configmap.yaml
# Purpose: Loki single-binary config - filesystem storage on a local-path PVC.
# depends_on: [k8s/base/namespaces.yaml]
#
# TEMPLATE: ${LOKI_RETENTION} substituted by scripts/bootstrap-observability.sh.
#
# Single-binary (all components in one process) with filesystem storage, not the
# microservices topology. The scaled-out mode needs object storage (S3/MinIO),
# which this platform does not have until Phase 6 at the earliest.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  loki.yaml: |
    auth_enabled: false   # single-tenant; the cluster network is the boundary

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: ${LOKI_RETENTION}
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      # Sized for a small cluster. A crash-looping pod can otherwise saturate
      # ingestion and evict everything useful.
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
      max_streams_per_user: 5000
      allow_structured_metadata: true

    compactor:
      working_directory: /loki/compactor
      delete_request_store: filesystem
      retention_enabled: true
      retention_delete_delay: 2h

    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules
