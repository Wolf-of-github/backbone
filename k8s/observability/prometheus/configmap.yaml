# configmap.yaml
# Purpose: prometheus.yml - k3s service discovery, Kong metrics, and the
#          annotation-driven scraping convention documented in docs/metrics-scraping.md.
# depends_on: [k8s/base/namespaces.yaml, rbac.yaml]
#
# TEMPLATE: CLUSTER_NAME and PROM_RETENTION are substituted by
# scripts/bootstrap-observability.sh.
#
# Note on '$' below: relabel configs use ${1} capture-group syntax, which must
# survive templating. render_template() passes an explicit allowlist to envsubst
# for exactly this reason - only the two vars above are substituted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      external_labels:
        cluster: ${CLUSTER_NAME}

    rule_files:
      - /etc/prometheus/rules/*.yaml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager.observability.svc:9093']

    scrape_configs:
      # Prometheus itself.
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      # Kong's own metrics. The `prometheus` plugin that exposes these is
      # enabled in the Kong declarative config by Phase 5A.
      - job_name: kong
        static_configs:
          - targets: ['kong-admin.platform.svc:8001']
        metrics_path: /metrics

      # Node-level metrics straight from each kubelet.
      - job_name: kubernetes-nodes
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      # cAdvisor - per-container CPU/memory, what the worker HPA reasons about.
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      # Application services. Opt-in by pod annotation - this is the convention
      # every backbone service follows (see docs/metrics-scraping.md):
      #   prometheus.io/scrape: "true"
      #   prometheus.io/port:   "3000"
      #   prometheus.io/path:   "/metrics"
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          # Drop the per-pod churn of completed Jobs - they would otherwise
          # accumulate as stale targets after every mongodb-init run.
          - source_labels: [__meta_kubernetes_pod_phase]
            action: drop
            regex: (Succeeded|Failed)
