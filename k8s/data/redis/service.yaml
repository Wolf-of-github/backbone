# Headless Service for stable in-cluster DNS: redis.data.svc.cluster.local
# depends_on: [k8s/data/redis/statefulset.yaml]
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: data
  labels:
    app.kubernetes.io/name: redis
    backbone.dev/tier: data
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
