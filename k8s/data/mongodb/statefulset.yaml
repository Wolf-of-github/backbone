# Single-replica MongoDB StatefulSet (Phase 1). No replica set / HA yet (Phase 6).
# depends_on: [k8s/base/namespaces.yaml, k8s/base/storageclass.yaml,
#              scripts/data-secrets.sh, k8s/data/mongodb/mongod-conf-configmap.yaml]
#
# The official image bootstraps the root user from MONGO_INITDB_ROOT_* on an
# EMPTY datadir only. The least-privilege app user is created afterwards by the
# mongodb-init Job (k8s/data/mongodb/init-job.yaml), not here.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: data
  labels:
    app.kubernetes.io/name: mongodb
    backbone.dev/tier: data
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        backbone.dev/tier: data
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999           # `mongodb` user in the official image
        runAsGroup: 999
        fsGroup: 999             # make the PVC group-writable for that user
      containers:
        - name: mongodb
          image: mongo:7.0
          args: ["--config", "/etc/mongo/mongod.conf"]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: root-password
          ports:
            - name: mongo
              containerPort: 27017
          volumeMounts:
            - name: conf
              mountPath: /etc/mongo
              readOnly: true
            - name: data
              mountPath: /data/db
          livenessProbe:
            exec:
              command:
                ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok === 1 || quit(1)"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok === 1 || quit(1)"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: conf
          configMap:
            name: mongod-conf
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
