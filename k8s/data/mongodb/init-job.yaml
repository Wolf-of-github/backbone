# One-shot Job: create the least-privilege app user + DB in MongoDB.
# depends_on: [k8s/data/mongodb/statefulset.yaml, k8s/data/mongodb/service.yaml,
#              k8s/data/mongodb/init-configmap.yaml, scripts/data-secrets.sh]
#
# Preferred over an initContainer, which races mongod's own startup. bootstrap-data.sh
# applies this only after `rollout status statefulset/mongodb` succeeds, then waits
# for `condition=complete`. The script is idempotent, so a re-apply (delete + apply)
# is safe. `ttlSecondsAfterFinished` cleans the Job pod up on its own.
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init
  namespace: data
  labels:
    app.kubernetes.io/name: mongodb
    backbone.dev/tier: data
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        backbone.dev/component: init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:7.0
          command:
            - sh
            - -c
            - |
              set -e
              # mongod may accept connections a beat after the pod is Ready.
              for i in $(seq 1 30); do
                if mongosh "mongodb://mongodb.data.svc:27017/admin" \
                     -u "$ROOT_USER" -p "$ROOT_PASSWORD" --quiet \
                     --eval "db.adminCommand('ping').ok === 1 || quit(1)" >/dev/null 2>&1; then
                  break
                fi
                echo "waiting for mongod... ($i)"; sleep 2
              done
              exec mongosh "mongodb://mongodb.data.svc:27017/admin" \
                -u "$ROOT_USER" -p "$ROOT_PASSWORD" --quiet \
                --file /init/init-app-user.js
          env:
            - name: ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: root-username
            - name: ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: root-password
            - name: APP_USER
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: app-username
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: app-password
            - name: APP_DB
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: app-db
          volumeMounts:
            - name: init
              mountPath: /init
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: mongodb-init
