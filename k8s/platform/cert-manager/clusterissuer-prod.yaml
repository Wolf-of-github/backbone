# clusterissuer-prod.yaml
# Purpose: Let's Encrypt PRODUCTION issuer (TLS_MODE=production). Trusted chain.
# depends_on: [scripts/cert-manager-install.sh, clusterissuer-staging.yaml]
#
# TEMPLATE: ACME_EMAIL is substituted by scripts/bootstrap-tls.sh.
#
# Rate limits are real here (50 certs per registered domain per week, and only
# 5 duplicate-certificate issuances per week). Rehearse with TLS_MODE=staging
# until the chain verifies, then switch - do not iterate against production.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: backbone-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          serviceType: ClusterIP
