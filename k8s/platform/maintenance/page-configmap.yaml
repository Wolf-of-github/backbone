# page-configmap.yaml
# Purpose: The maintenance page itself - HTML + NGINX config, mounted into a
#          stock nginx image. No Dockerfile, no build, no registry.
# depends_on: [k8s/base/namespaces.yaml]
#
# Deliberately not a built image. This is one static HTML file; bundling it into
# a container would mean a build-push cycle (and, with Phase 5C deferred, a
# dependency on the external registry) every time the wording changes. Mounted
# from a ConfigMap, editing the page is `kubectl apply` + a rollout restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: maintenance-page
  namespace: platform
data:
  nginx.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      # The pod's own health check must NOT return 503, or the kubelet decides
      # the maintenance page is unhealthy and restarts it during maintenance -
      # precisely when it is needed. Declared first; nginx matches exact
      # locations before prefixes.
      location = /healthz {
        access_log off;
        add_header Content-Type application/json always;
        return 200 '{"status":"healthy"}';
      }

      # Serve the page body itself with a normal 200 - this is the internal
      # redirect target, not a request clients make directly.
      location = /maintenance.html {
        internal;
        add_header Retry-After 3600 always;
      }

      # Everything else: 503 with the page as the body. Status 503 (not 200) is
      # what tells crawlers, uptime monitors and API clients this is temporary;
      # a 200 would have them cache the page and treat the outage as content.
      # Retry-After tells well-behaved clients when to come back.
      location / {
        add_header Retry-After 3600 always;
        return 503;
      }

      error_page 503 /maintenance.html;
    }

  maintenance.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Down for maintenance</title>
      <style>
        :root { color-scheme: light dark; }
        body {
          margin: 0; min-height: 100vh;
          display: flex; align-items: center; justify-content: center;
          font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
          background: #fafafa; color: #1a1a1a;
        }
        @media (prefers-color-scheme: dark) {
          body { background: #131313; color: #e8e8e8; }
          .card { background: #1c1c1c; border-color: #2e2e2e; }
          input { background: #131313; color: #e8e8e8; border-color: #333; }
        }
        .card {
          max-width: 32rem; margin: 1.5rem; padding: 2.5rem;
          background: #fff; border: 1px solid #e5e5e5; border-radius: 10px;
        }
        h1 { margin: 0 0 .75rem; font-size: 1.5rem; letter-spacing: -.01em; }
        p  { margin: 0 0 1rem; color: #666; }
        @media (prefers-color-scheme: dark) { p { color: #999; } }
        details { margin-top: 2rem; font-size: .875rem; }
        summary { cursor: pointer; color: #888; }
        form { margin-top: 1rem; display: flex; flex-direction: column; gap: .5rem; }
        input, button {
          padding: .55rem .7rem; font: inherit; font-size: .875rem;
          border: 1px solid #ddd; border-radius: 6px;
        }
        button { background: #1a1a1a; color: #fff; border-color: #1a1a1a; cursor: pointer; }
        button:disabled { opacity: .5; cursor: default; }
        .msg { font-size: .8125rem; min-height: 1.2em; }
        .err { color: #c0392b; } .okmsg { color: #27835a; }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>Down for maintenance</h1>
        <p>We're making some changes and will be back shortly. Existing data is
           safe — this is planned work, not an outage.</p>
        <p>Please try again in a little while.</p>

        <details>
          <summary>Administrator access</summary>
          <form id="f">
            <input type="email" id="email" placeholder="Email" autocomplete="username" required>
            <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
            <button type="submit" id="btn">End maintenance</button>
            <div class="msg" id="m"></div>
          </form>
        </details>
      </div>

      <script>
        // Logs in, then calls the auth service's admin-only off endpoint.
        // Both paths are on the gateway's maintenance bypass list, so they stay
        // reachable while everything else returns 503.
        const f = document.getElementById('f');
        const m = document.getElementById('m');
        const btn = document.getElementById('btn');

        f.addEventListener('submit', async (e) => {
          e.preventDefault();
          btn.disabled = true;
          m.className = 'msg';
          m.textContent = 'Working…';
          try {
            const login = await fetch('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
              }),
            });
            if (!login.ok) throw new Error('Invalid credentials');
            const { accessToken } = await login.json();

            const off = await fetch('/internal/maintenance/off', {
              method: 'POST',
              headers: { 'Authorization': 'Bearer ' + accessToken },
            });
            if (off.status === 403) throw new Error('That account is not an administrator');
            if (!off.ok) throw new Error('Could not end maintenance');

            m.className = 'msg okmsg';
            m.textContent = 'Maintenance ended. Reloading…';
            setTimeout(() => location.reload(), 2500);
          } catch (err) {
            m.className = 'msg err';
            m.textContent = err.message;
            btn.disabled = false;
          }
        });
      </script>
    </body>
    </html>
