# Exposes the private registry to nodes and CI.
# depends_on: [k8s/platform/registry/deployment.yaml]
#
# ClusterIP for in-cluster pulls; NodePort 30500 so nodes/CI can push/pull at
# <node-ip>:30500 (matches REGISTRY_PORT guidance when REGISTRY_HOST is a node IP).
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: platform
  labels:
    app: registry
spec:
  type: NodePort
  selector:
    app: registry
  ports:
    - name: https
      port: 5000
      targetPort: 5000
      nodePort: 30500
