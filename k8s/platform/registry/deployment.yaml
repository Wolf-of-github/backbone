# Private container registry (registry:2) with htpasswd basic-auth and TLS.
# depends_on: [k8s/base/namespaces.yaml, k8s/base/storageclass.yaml]
#
# Consumes:
#   secret registry-auth (key: htpasswd)          -> /auth/htpasswd
#   secret registry-tls  (tls.crt / tls.key)      -> /certs/
#   pvc    registry-data                          -> /var/lib/registry
# Both secrets are created by scripts/registry-secret.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: platform
  labels:
    app: registry
spec:
  replicas: 1
  strategy:
    type: Recreate            # single RWO volume - no rolling overlap
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          # registry:2.8.3 - pin by digest in a real deploy; tag kept here for readability.
          image: registry:2.8.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 5000
          env:
            - name: REGISTRY_AUTH
              value: "htpasswd"
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: "backbone-registry"
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: "/auth/htpasswd"
            - name: REGISTRY_HTTP_ADDR
              value: "0.0.0.0:5000"
            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: "/certs/tls.crt"
            - name: REGISTRY_HTTP_TLS_KEY
              value: "/certs/tls.key"
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: "/var/lib/registry"
          volumeMounts:
            - name: auth
              mountPath: /auth
              readOnly: true
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: data
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v2/
              port: 5000
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: auth
          secret:
            secretName: registry-auth
        - name: certs
          secret:
            secretName: registry-tls
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
