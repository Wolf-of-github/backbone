# deployment.yaml
# Purpose: Kong Deployment in DB-less mode
# depends_on: [kong-configmap.yaml]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: platform
  labels:
    app: kong
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      # The kong image runs as uid/gid 1000. Kubernetes mounts secret files
      # root-owned, so without fsGroup the TLS private key is unreadable and
      # Kong dies at startup with:
      #   ssl_cert: failed loading certificate from /etc/secrets/kong-tls/tls.crt
      # fsGroup makes the mounted files group-owned by 1000; defaultMode on the
      # volume below then makes them group-readable.
      securityContext:
        fsGroup: 1000
      containers:
      - name: kong
        image: kong:3.4
        env:
        - name: KONG_DATABASE
          value: "off"
        - name: KONG_DECLARATIVE_CONFIG
          value: /kong/declarative/kong.yaml
        # HTTP only by default, so Phase 2 stands alone on a cluster that has
        # never run Phase 5A. scripts/bootstrap-tls.sh patches this to
        # "0.0.0.0:8000, 0.0.0.0:8443 ssl" and sets KONG_SSL_CERT/_KEY once the
        # kong-tls-cert secret exists. Declaring an ssl listener with no cert
        # present makes Kong refuse to start, so the order matters.
        - name: KONG_PROXY_LISTEN
          value: "0.0.0.0:8000"
        - name: KONG_ADMIN_LISTEN
          value: "0.0.0.0:8001"
        - name: KONG_LOG_LEVEL
          value: "info"
        ports:
        - name: proxy
          containerPort: 8000
          protocol: TCP
        - name: proxy-ssl
          containerPort: 8443
          protocol: TCP
        - name: admin
          containerPort: 8001
          protocol: TCP
        volumeMounts:
        - name: kong-config
          mountPath: /kong/declarative
          readOnly: true
        - name: kong-tls
          mountPath: /etc/secrets/kong-tls
          readOnly: true
        readinessProbe:
          httpGet:
            path: /status
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /status
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 15
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
      volumes:
      - name: kong-config
        configMap:
          name: kong-declarative-config
      # optional: true so Phase 2 still comes up standalone on a cluster that has
      # never run Phase 5A. Without it Kong would hang in ContainerCreating until
      # cert-manager existed, making TLS a hard prerequisite for the gateway.
      # Kong only reads KONG_SSL_CERT when a TLS listener is actually configured.
      - name: kong-tls
        secret:
          secretName: kong-tls-cert
          optional: true
          # 0640: owner+group read, nothing for other. Combined with the
          # fsGroup above this is the minimum that lets Kong read its own
          # private key without making it world-readable in the container.
          defaultMode: 0640
