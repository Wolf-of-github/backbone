# server-deployment.yaml
# Purpose: Drone CI server - receives Gitea webhooks, schedules builds.
# depends_on: [../gitea/service.yaml, scripts/gitea-secrets.sh]
#
# TEMPLATE: ${DRONE_SERVER_HOST}, ${DRONE_SERVER_PROTO} and ${GITEA_SERVER_URL}
# substituted by scripts/bootstrap-ci.sh.
#
# The Gitea OAuth client id/secret come from the drone-gitea-oauth Secret, which
# bootstrap-ci.sh creates by registering the OAuth app through Gitea's API -
# doing that by hand in the UI would make the phase non-reproducible.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: drone-data
  namespace: ci
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drone-server
  namespace: ci
  labels:
    app: drone-server
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO PVC
  selector:
    matchLabels:
      app: drone-server
  template:
    metadata:
      labels:
        app: drone-server
    spec:
      containers:
      - name: drone-server
        image: drone/drone:2.25.0
        env:
        - name: DRONE_GITEA_SERVER
          value: ${GITEA_SERVER_URL}
        - name: DRONE_GITEA_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: drone-gitea-oauth
              key: client-id
        - name: DRONE_GITEA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: drone-gitea-oauth
              key: client-secret
        - name: DRONE_RPC_SECRET
          valueFrom:
            secretKeyRef:
              name: drone-rpc-secret
              key: rpc-secret
        - name: DRONE_SERVER_HOST
          value: ${DRONE_SERVER_HOST}
        - name: DRONE_SERVER_PROTO
          value: ${DRONE_SERVER_PROTO}
        # Kong terminates TLS; Drone must not try to obtain its own cert.
        - name: DRONE_TLS_AUTOCERT
          value: "false"
        - name: DRONE_DATABASE_DRIVER
          value: sqlite3
        - name: DRONE_DATABASE_DATASOURCE
          value: /data/database.sqlite
        # Gitea is served over a self-signed cert when TLS_MODE=selfsigned.
        - name: DRONE_GITEA_SKIP_VERIFY
          value: "true"
        # Only the platform admin may create repos/builds here.
        - name: DRONE_USER_CREATE
          valueFrom:
            secretKeyRef:
              name: drone-gitea-oauth
              key: admin-user-create
        ports:
        - name: http
          containerPort: 80
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: drone-data
---
apiVersion: v1
kind: Service
metadata:
  name: drone-server
  namespace: ci
  labels:
    app: drone-server
spec:
  type: ClusterIP
  selector:
    app: drone-server
  ports:
  - name: http
    port: 80
    targetPort: 80
