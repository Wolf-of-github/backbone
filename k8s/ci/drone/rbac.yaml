# rbac.yaml
# Purpose: Permissions for the Drone Kubernetes runner to create build pods.
# depends_on: [k8s/base/namespaces.yaml]
#
# Namespaced to `ci` deliberately. The runner creates a pod per pipeline step,
# so it needs pod and secret create rights - but ONLY in the namespace where
# builds run. Pipelines that deploy to `app` do so with the separate, far more
# limited credential minted by scripts/deploy-key.sh, not with this one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drone-runner
  namespace: ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drone-runner
  namespace: ci
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "create", "delete", "list", "watch", "update"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "delete", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drone-runner
  namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: drone-runner
subjects:
- kind: ServiceAccount
  name: drone-runner
  namespace: ci
