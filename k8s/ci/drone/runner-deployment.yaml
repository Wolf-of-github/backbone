# runner-deployment.yaml
# Purpose: Drone Kubernetes runner - turns each pipeline step into a pod.
# depends_on: [server-deployment.yaml, rbac.yaml]
#
# Build steps become pods scheduled by the normal k8s scheduler, so CI load
# spreads across every joined worker node - the same horizontal-scale property
# the rest of the platform has. No dedicated build machine.
#
# No public route. The runner dials the server over the cluster network and
# authenticates with the shared RPC secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drone-runner
  namespace: ci
  labels:
    app: drone-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drone-runner
  template:
    metadata:
      labels:
        app: drone-runner
    spec:
      serviceAccountName: drone-runner
      containers:
      - name: drone-runner
        image: drone/drone-runner-kube:1.0.0-rc.3
        env:
        - name: DRONE_RPC_HOST
          value: drone-server.ci.svc
        - name: DRONE_RPC_PROTO
          value: http
        - name: DRONE_RPC_SECRET
          valueFrom:
            secretKeyRef:
              name: drone-rpc-secret
              key: rpc-secret
        # Build pods land in `ci`, which is the only namespace rbac.yaml grants
        # pod-create rights in.
        - name: DRONE_NAMESPACE_DEFAULT
          value: ci
        - name: DRONE_SERVICE_ACCOUNT_DEFAULT
          value: default
        ports:
        - name: http
          containerPort: 3000
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
