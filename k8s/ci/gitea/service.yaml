# service.yaml
# Purpose: ClusterIP for Gitea HTTP (also the container registry) and SSH.
# depends_on: [statefulset.yaml]
#
# Named gitea-http because that hostname is baked into image references once
# REGISTRY_MODE=incluster (see registry_prefix() in scripts/lib.sh). Renaming
# this Service would invalidate every deployed image reference.
apiVersion: v1
kind: Service
metadata:
  name: gitea-http
  namespace: ci
  labels:
    app: gitea
spec:
  type: ClusterIP
  selector:
    app: gitea
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  - name: ssh
    port: 22
    targetPort: 2222
