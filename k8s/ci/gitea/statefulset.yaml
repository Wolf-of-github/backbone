# statefulset.yaml
# Purpose: Gitea - git repositories AND the container registry, on one PVC.
# depends_on: [configmap.yaml, scripts/gitea-secrets.sh, k8s/base/storageclass.yaml]
#
# The 20Gi volume holds repos, the SQLite database, AND every container image
# layer the platform pushes. Image layers dominate: six services, several tags
# each. Watch the PVCNearlyFull alert from Phase 5B on this one specifically.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitea
  namespace: ci
  labels:
    app: gitea
spec:
  serviceName: gitea
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      securityContext:
        # The gitea image's `git` user.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: gitea
        image: gitea/gitea:1.22.3-rootless
        env:
        - name: GITEA_APP_INI
          value: /etc/gitea/conf/app.ini
        - name: GITEA__security__SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: gitea-admin
              key: secret-key
        - name: GITEA__security__INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: gitea-admin
              key: internal-token
        ports:
        - name: http
          containerPort: 3000
        - name: ssh
          containerPort: 2222
        volumeMounts:
        - name: config
          mountPath: /etc/gitea/conf
          readOnly: true
        - name: data
          mountPath: /var/lib/gitea
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /api/healthz
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /api/healthz
            port: 3000
          initialDelaySeconds: 90
          periodSeconds: 30
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
      volumes:
      - name: config
        configMap:
          name: gitea-config
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 20Gi
