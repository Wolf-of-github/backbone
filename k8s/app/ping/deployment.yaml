# deployment.yaml
# Purpose: Ping service Deployment
# depends_on: [services/ping/Dockerfile, k8s/base/namespaces.yaml]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping
  namespace: app
  labels:
    app: ping
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ping
  template:
    metadata:
      # Phase 5B: opt in to Prometheus discovery. These MUST be on the pod
      # template - annotations on the Deployment itself are ignored.
      # See docs/metrics-scraping.md.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
      labels:
        app: ping
    spec:
      containers:
      - name: ping
        image: ${REGISTRY_URL}/backbone-ping:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        volumeMounts:
        # authContext.js resolves the public key at src/jwt-public-key.pem
        # (one level up from src/common/authContext.js). Without this mount
        # authContext.js finds no key, falls back to jwt.decode() with no
        # signature check, and requireAuth accepts any well-formed JWT -
        # including a forged one - as long as it decodes.
        - name: jwt-public-key
          mountPath: /app/src/jwt-public-key.pem
          subPath: jwt-public-key.pem
          readOnly: true
      volumes:
      - name: jwt-public-key
        secret:
          secretName: jwt-public-key
          items:
          - key: public-key
            path: jwt-public-key.pem
