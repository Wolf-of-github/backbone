# deployment.yaml
# Purpose: Ping service Deployment
# depends_on: [services/ping/Dockerfile, k8s/base/namespaces.yaml]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping
  namespace: app
  labels:
    app: ping
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ping
  template:
    metadata:
      # Phase 5B: opt in to Prometheus discovery. These MUST be on the pod
      # template - annotations on the Deployment itself are ignored.
      # See docs/metrics-scraping.md.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
      labels:
        app: ping
    spec:
      # Spread replicas across NODES (added 2026-10-04, issues.txt AVAIL-1).
      # Without this the scheduler may put every replica on one machine, and
      # did: when a worker vanished on 2026-10-04, 10 pods went Terminating at
      # once. The platform survived only because each service happened to also
      # have a copy on the other node - luck, not design. A replica count of 2
      # meant "survives a pod crash", never "survives losing a machine".
      #
      # ScheduleAnyway, NOT DoNotSchedule: this cluster is sometimes a single
      # node, and the strict version would leave the second replica Pending
      # forever there. Soft means "prefer different nodes, but run anyway" -
      # the right trade when the alternative is not running at all.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: ping
      containers:
      - name: ping
        image: ${REGISTRY_URL}/backbone-ping:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
        volumeMounts:
        # REQUIRED. services/common/authContext.js reads the JWT public key
        # from here and REFUSES TO START without it. Before 2026-10-04 this
        # mount was absent and the module silently fell back to accepting
        # unverified tokens - see issues.txt SEC-1. Only the public key is
        # projected; this service has no business holding the private one.
        - name: jwt-keys
          mountPath: /secrets/jwt
          readOnly: true
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      volumes:
      - name: jwt-keys
        secret:
          secretName: jwt-keypair
          items:
          - key: public-key
            path: public-key
