apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: app
  labels:
    app: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      # Phase 5B: opt in to Prometheus discovery. These MUST be on the pod
      # template - annotations on the Deployment itself are ignored.
      # See docs/metrics-scraping.md.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
      labels:
        app: auth
    spec:
      # Spread replicas across NODES (added 2026-10-04, issues.txt AVAIL-1).
      # Without this the scheduler may put every replica on one machine, and
      # did: when a worker vanished on 2026-10-04, 10 pods went Terminating at
      # once. The platform survived only because each service happened to also
      # have a copy on the other node - luck, not design. A replica count of 2
      # meant "survives a pod crash", never "survives losing a machine".
      #
      # ScheduleAnyway, NOT DoNotSchedule: this cluster is sometimes a single
      # node, and the strict version would leave the second replica Pending
      # forever there. Soft means "prefer different nodes, but run anyway" -
      # the right trade when the alternative is not running at all.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: auth
      # Phase 6B: the maintenance off-endpoint calls the Kubernetes API with
      # this ServiceAccount's token. Its permissions are in k8s/app/auth/rbac.yaml
      # and are limited to two named ConfigMaps plus restarting Kong.
      serviceAccountName: auth
      containers:
      - name: auth
        image: REGISTRY_URL/backbone-auth:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        # MongoDB credentials (from Phase 1 secret)
        - name: MONGO_APP_USER
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: app-username
        - name: MONGO_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: app-password
        - name: MONGO_APP_DB
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: app-db
        # Redis credentials (from Phase 1 secret)
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-password
              key: password
        # JWT settings (from ConfigMap)
        - name: JWT_ACCESS_EXPIRY
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: JWT_ACCESS_EXPIRY
        - name: JWT_REFRESH_EXPIRY
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: JWT_REFRESH_EXPIRY
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: FRONTEND_URL
        volumeMounts:
        - name: jwt-keys
          mountPath: /secrets/jwt
          readOnly: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: jwt-keys
        secret:
          secretName: jwt-keypair
