# service.yaml
# Purpose: Notes API ClusterIP Service
# depends_on: [deployment.yaml]

apiVersion: v1
kind: Service
metadata:
  name: notes-api
  namespace: app
  labels:
    app: notes-api
spec:
  type: ClusterIP
  selector:
    app: notes-api
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
