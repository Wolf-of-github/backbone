# deployment.yaml
# Purpose: Frontend Deployment
# depends_on: [services/frontend/Dockerfile, k8s/base/namespaces.yaml]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # Spread replicas across NODES (added 2026-10-04, issues.txt AVAIL-1).
      # Without this the scheduler may put every replica on one machine, and
      # did: when a worker vanished on 2026-10-04, 10 pods went Terminating at
      # once. The platform survived only because each service happened to also
      # have a copy on the other node - luck, not design. A replica count of 2
      # meant "survives a pod crash", never "survives losing a machine".
      #
      # ScheduleAnyway, NOT DoNotSchedule: this cluster is sometimes a single
      # node, and the strict version would leave the second replica Pending
      # forever there. Soft means "prefer different nodes, but run anyway" -
      # the right trade when the alternative is not running at all.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: frontend
      containers:
      - name: frontend
        image: ${REGISTRY_URL}/backbone-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
