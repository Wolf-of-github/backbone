apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-api
  namespace: app
  labels:
    app: jobs-api
    phase: "4"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobs-api
  template:
    metadata:
      # Phase 5B: opt in to Prometheus discovery. These MUST be on the pod
      # template - annotations on the Deployment itself are ignored.
      # See docs/metrics-scraping.md.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
      labels:
        app: jobs-api
    spec:
      # Spread replicas across NODES (added 2026-10-04, issues.txt AVAIL-1).
      # Without this the scheduler may put every replica on one machine, and
      # did: when a worker vanished on 2026-10-04, 10 pods went Terminating at
      # once. The platform survived only because each service happened to also
      # have a copy on the other node - luck, not design. A replica count of 2
      # meant "survives a pod crash", never "survives losing a machine".
      #
      # ScheduleAnyway, NOT DoNotSchedule: this cluster is sometimes a single
      # node, and the strict version would leave the second replica Pending
      # forever there. Soft means "prefer different nodes, but run anyway" -
      # the right trade when the alternative is not running at all.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: jobs-api
      containers:
      - name: jobs-api
        image: REGISTRY_URL/backbone-jobs-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: MONGO_HOST
          value: "mongodb.data.svc"
        - name: MONGO_PORT
          value: "27017"
        - name: MONGO_APP_USER
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: app-username
        - name: MONGO_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: app-password
        - name: MONGO_APP_DB
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: app-db
        - name: REDIS_HOST
          value: "redis.data.svc"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-password
              key: password
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        # REQUIRED. services/common/authContext.js reads the JWT public key
        # from here and REFUSES TO START without it. Before 2026-10-04 this
        # mount was absent and the module silently fell back to accepting
        # unverified tokens - see issues.txt SEC-1. Only the public key is
        # projected; this service has no business holding the private one.
        - name: jwt-keys
          mountPath: /secrets/jwt
          readOnly: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
      volumes:
      - name: jwt-keys
        secret:
          secretName: jwt-keypair
          items:
          - key: public-key
            path: public-key
