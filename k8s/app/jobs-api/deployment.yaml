apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-api
  namespace: app
  labels:
    app: jobs-api
    phase: "4"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobs-api
  template:
    metadata:
      # Phase 5B: opt in to Prometheus discovery. These MUST be on the pod
      # template - annotations on the Deployment itself are ignored.
      # See docs/metrics-scraping.md.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
      labels:
        app: jobs-api
    spec:
      containers:
      - name: jobs-api
        image: REGISTRY_URL/backbone-jobs-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: MONGO_HOST
          value: "mongodb.data.svc"
        - name: MONGO_PORT
          value: "27017"
        - name: MONGO_APP_USER
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: app-username
        - name: MONGO_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: app-password
        - name: MONGO_APP_DB
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: app-db
        - name: REDIS_HOST
          value: "redis.data.svc"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-password
              key: password
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        volumeMounts:
        # authContext.js resolves the public key at src/jwt-public-key.pem
        # (one level up from src/common/authContext.js). Without this mount
        # authContext.js finds no key, falls back to jwt.decode() with no
        # signature check, and requireAuth accepts any well-formed JWT -
        # including a forged one - as long as it decodes.
        - name: jwt-public-key
          mountPath: /app/src/jwt-public-key.pem
          subPath: jwt-public-key.pem
          readOnly: true
      volumes:
      - name: jwt-public-key
        secret:
          secretName: jwt-public-key
          items:
          - key: public-key
            path: jwt-public-key.pem
