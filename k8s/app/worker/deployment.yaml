apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: app
  labels:
    app: worker
    phase: "4"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      # Phase 5B: opt in to Prometheus discovery. These MUST be on the pod
      # template - annotations on the Deployment itself are ignored.
      # See docs/metrics-scraping.md.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: worker
        image: REGISTRY_URL/backbone-worker:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: health
        env:
        - name: NODE_ENV
          value: "production"
        - name: WORKER_CONCURRENCY
          value: "5"
        - name: MONGO_HOST
          value: "mongodb.data.svc"
        - name: MONGO_PORT
          value: "27017"
        - name: MONGO_APP_USER
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: app-username
        - name: MONGO_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: app-password
        - name: MONGO_APP_DB
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: app-db
        - name: REDIS_HOST
          value: "redis.data.svc"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-password
              key: password
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
