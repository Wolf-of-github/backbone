# Core namespace split for the platform.
# depends_on: [scripts/install-k3s.sh]
#
#   platform - gateway / infra (registry now; Kong, cert-manager later)
#   data     - datastores (MongoDB, Redis later)
#   app      - application services (auth, jobs-api, worker later)
#
# observability (Phase 5B) and ci (Phase 5C, deferred by choice - see
# HANDOFF.md) are NOT created here. observability is created by the Phase 5B
# bring-up (make obs); ci is deliberately not created at all right now.
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    backbone.dev/tier: platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: data
  labels:
    backbone.dev/tier: data
---
apiVersion: v1
kind: Namespace
metadata:
  name: app
  labels:
    backbone.dev/tier: app
